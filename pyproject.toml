[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-ntfs"
version = "0.3.0"
description = "A native Windows NTFS/MFT storage evidence prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sage = "sage.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
